[include indx.cfg]
[include indx-tc-macros.cfg]
[include indx-cal.cfg]

[mcu indxmcu]
serial: /dev/serial/by-id/usb-Bondtech_INDX*******  # fill in your adress
restart_method:command

### uncomment ONLY if you don't have already an [save_variable] entry in your printer.cfg ###
#[save_variables]
#filename: /home/pi/printer_data/config/variables.cfg

[indx]
mcu: indxmcu

# These are control parameters for the induction heater — leave them at these values
pid_kp: 1.0
pid_ti: 0.0
pid_td: 0.0
pid_b: 1.0

[gcode_button endstop]
pin: ^indxmcu:endstop
press_gcode: {action_respond_info("press")}
release_gcode: {action_respond_info("release")}

[lis2dw]
# Built-in accelerometer on the INDX PCB — used for input shaper calibration
i2c_mcu: indxmcu
i2c_bus: sercom3

[angle indx]
# Magnetic encoder that reads extruder rotation — used for precise extrusion monitoring
sensor_type: as5047d
stepper: extruder
cs_pin: indxmcu:encoder_cs
spi_bus: sercom1

### INDX loadcell ###
[load_cell_probe]
sensor_type: ads131m02
cs_pin: indxmcu:loadcell_cs
spi_bus: sercom1
data_ready_pin: indxmcu:loadcell_drdy
z_offset: 0
channels: 0
force_safety_limit: 0
trigger_force: 150
speed: 2
pullback_distance: 0.2
pullback_speed: 0.3
samples: 1
sample_retract_dist: 0.25
samples_tolerance: 0.05
samples_tolerance_retries: 3
sample_rate: 500

[resonance_tester]
accel_chip: lis2dw
probe_points:
    250, 250, 30  
accel_per_hz: 75

[extruder]
sensor_type: indx
min_temp: 0
min_extrude_temp: 180
max_temp: 350
heater_pin: indx:heater
control: watermark
nozzle_diameter: 0.4
filament_diameter: 1.75
step_pin: indxmcu:motor_step
dir_pin: indxmcu:motor_dir  # If filament feeds backwards, change to: !indxmcu:motor_dir
enable_pin: !indxmcu:motor_enable
microsteps: 32
rotation_distance: 5.7
max_extrude_only_distance: 250
max_extrude_cross_section: 60
pressure_advance: 0.020
pressure_advance_smooth_time: 0.020

[tmc2240 extruder]
cs_pin: indxmcu:motor_cs
spi_software_sclk_pin: indxmcu:motor_sclk
spi_software_mosi_pin: indxmcu:motor_mosi
spi_software_miso_pin: indxmcu:motor_miso
rref: 24000  # Reference resistor value for the TMC2240 on the INDX PCB — do not change
run_current: 0.6
