#####################################################################
#  INDX HOMING OVERRIDE
#####################################################################
#
#  Include AFTER the other INDX macros:
#    [include indx/indx.cfg]
#    [include indx/indx-tc-macros.cfg]
#    [include indx/indx-cal.cfg]
#    [include indx/homing.cfg]
#
#  Klipper allows only ONE [homing_override]. If your printer.cfg
#  already has one (sensorless current, bed raiser, etc.), merge this
#  sequence into yours - do not include both.
#
#  Sequence (full G28):
#    1. Raise to probe_z_clearance. If Z is unknown, hop then un-home Z
#       so the later probe is a real home.
#    2. Home Y (X always needs Y first).
#    3. Home X. If Y was already homed and the head is still on the
#       dock side, move to clearance_y first.
#    4. Before Z, work out whether a tool is seated, then probe at
#       probe_x / probe_y and lift to probe_z_clearance.
#
#       Which source answers that is set by home_check_seat in
#       indx.cfg, and it is False by default.
#
#       False: active_tool answers it, the same source every tool
#       change already trusts. A stale value is not caught here.
#
#       True: the load cell answers it, and must agree with
#       active_tool. Either one alone can be wrong: the saved number
#       goes stale, and the cell reads empty if it was tared with a
#       tool in the head. When they disagree, in either direction,
#       INDX refuses and asks. It fetches T0 only when both say the
#       head is empty, so a pickup can never drive a loaded tool into
#       a dock. Costs a settle and a reading on every G28 Z, and a
#       drifted tare refuses a homing that would have been fine.
#
#  G28 Z homes with whatever tool is seated. CAL_Z offsets stay
#  relative to T0. Home XY before G28 Z.
#
#  Sensorless XY: wrap G28 Y / G28 X with your TMC current change.
#
#  Check, either setting:
#    - G28 with a locked tool: no trip to the dock for T0
#    - G28 Z with no XY: error
#    - G28 X with Y unknown: homes Y then X
#
#  Check, home_check_seat False (default):
#    - Saved tool set: probe with it, cell never read
#    - No saved tool, Z already homed: pick T0 then probe
#    - No saved tool, Z never homed: error (seat by hand)
#
#  Check, home_check_seat True:
#    - Empty cell + no saved tool, Z never homed: error (seat by hand)
#    - Empty cell + no saved tool, Z already homed: pick T0 then probe
#    - Empty cell but a saved tool: error, no movement (tare or reset)
#    - Seated cell but no saved tool: error, no movement
#    - No load cell / uncalibrated: error
#
#####################################################################

[homing_override]
axes: xyz
gcode:
    {% set home_all = not ('X' in params or 'Y' in params or 'Z' in params) %}
    {% set home_x = home_all or 'X' in params %}
    {% set home_z = home_all or 'Z' in params %}
    # X requires Y: G28 X with Y unknown homes Y first
    {% set home_y = home_all or 'Y' in params
        or (home_x and "y" not in printer.toolhead.homed_axes) %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}

    # 1. Clear Z before any axis home
    _INDX_SAFE_Z_HOP

    # 2. Home Y first (X-first can sweep into tools)
    {% if home_y %}
        G28 Y
    {% endif %}

    # 3. Stay off the dock line before X. Homing X sweeps the head across
    # every dock position, so it has to happen at a Y that clears the tools.
    # Where the head is by now depends on how Y got homed:
    #   Y just homed - it is at its endstop. This template renders before
    #     G28 Y runs, so printer.toolhead.position still reports the pre-home
    #     value; position_endstop from the config is where Y actually lands.
    #   Y already homed and untouched - the live position is correct.
    # Either way, move only when that Y is on the dock side of clearance_y.
    # A machine whose Y endstop is opposite the docks is already clear and
    # should home X where it stands, which is also further from the tools
    # than clearance_y is.
    {% if home_x %}
        {% set clear_y = tp.clearance_y|float %}
        {% set ns = namespace(cur_y=none) %}
        {% if home_y %}
            {% set ycfg = printer.configfile.settings.stepper_y %}
            {% if "position_endstop" in ycfg %}
                {% set ns.cur_y = ycfg.position_endstop|float %}
            {% endif %}
        {% else %}
            {% set ns.cur_y = printer.toolhead.position.y|float %}
        {% endif %}
        # An unknown Y cannot be proven clear, so move rather than assume.
        {% if ns.cur_y is none or (ns.cur_y - clear_y) * (tp.dock_dir|float) > 0 %}
            G90
            G0 Y{"%.3f"|format(clear_y)} F3000
        {% endif %}
        G28 X
    {% endif %}

    # 4. Z needs a seated tool (load cell = nozzle probe)
    {% if home_z %}
        _INDX_HOME_Z
    {% endif %}

[gcode_macro _INDX_SAFE_Z_HOP]
description: Inner - clear Z to probe_z_clearance before any axis home
# The hop runs before Y moves, which means a head sitting inside the dock at
# real Y < clearance_y lifts into a docked tool. Moving Y first instead would
# drag the nozzle across the bed whenever real Z is near 0. The hop wins: it
# can reach one tool at most, and the stock docks allow the tool some Z travel
# by design, where a bed scrape is permanent. Swap the two if your machine
# makes the opposite trade.
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set z_clr = tp.probe_z_clearance|float %}
    {% if "z" not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
        G91
        G0 Z{z_clr} F900
        G90
        # Empty SET_HOMED= is required: CLEAR_HOMED=Z alone defaults SET_HOMED=XYZ
        SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
    {% elif printer.toolhead.position.z|float < z_clr %}
        G90
        G0 Z{z_clr} F900
    {% endif %}

[gcode_macro _INDX_HOME_VERIFY]
description: Inner - settle, decide whether a tool is seated, store the answer
# Dispatch is deliberately the caller's job. An empty-head G28 reads the seat
# twice, once before the T0 pickup and once after, and Klipper refuses to
# re-enter a macro that is still on the call stack. Returning to the caller
# instead of calling onward keeps this macro off the stack for the second read,
# so one macro serves both. The earlier fix duplicated it under a second name;
# this shape is from @charliemayall in #70 and needs no copy.
#
# Callers run _INDX_HOME_Z_AFTER_SOFT or _INDX_HOME_Z_AFTER_HARD as the next
# command. On a bad reading this raises instead, and the error aborts the whole
# G28, so the dispatch line that follows the call never runs.
variable_last_ok: -1
variable_last_force_g: 0.0
variable_last_err: ""
variable_settle_ms: 800
gcode:
    {% if printer["gcode_macro TOOL_POSITIONS"].home_check_seat|default(false) %}
        M400
        G4 P{printer["gcode_macro _INDX_HOME_VERIFY"].settle_ms|int}
        # G4 only queues the dwell on the toolhead and returns, so without this
        # second M400 the read below runs the instant the moves stop and the
        # settle time buys nothing. The first M400 drains the moves, this one
        # waits out the dwell.
        M400
        _INDX_HOME_READ_CELL
    {% else %}
        _INDX_HOME_SEAT_FROM_STATE
    {% endif %}
    _INDX_HOME_VERIFY_RAISE

[gcode_macro _INDX_HOME_SEAT_FROM_STATE]
description: Inner - seat check off: answer from active_tool instead of the cell
# home_check_seat is False, so the load cell is not asked whether a tool is
# seated and active_tool is the only source left. Writing last_ok from it lets
# the AFTER macros stay exactly as they are: the two can no longer contradict
# each other, so the branches that refuse a contradiction simply never match.
gcode:
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_VERIFY VARIABLE=last_ok VALUE={1 if act >= 0 else 0}
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_VERIFY VARIABLE=last_force_g VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_VERIFY VARIABLE=last_err VALUE='""'

[gcode_macro _INDX_HOME_READ_CELL]
description: Inner - store the seat reading, or the reason there is none
gcode:
    {% set min_g = printer["gcode_macro TOOL_POSITIONS"].home_min_force_g|default(800.0)|float %}
    {% set ns = namespace(ok=0, force=0.0, err="") %}

    {% if 'load_cell_probe' not in printer %}
        {% set ns.err = "Cannot home Z: [load_cell_probe] is missing. Add it to printer.cfg, FIRMWARE_RESTART, then G28." %}
    {% else %}
        {% set lc = printer.load_cell_probe %}
        {% set fg = lc.force_g|default(none) %}
        {% if not lc.is_calibrated|default(false) or fg is none %}
            {% set ns.err = "Cannot home Z: load cell is not calibrated. Run CALIBRATE_LOAD_CELL with an empty head, seat a tool, then CALIBRATE_LOAD_CELL_APPLY and SAVE_CONFIG. See Load cell calibration in the README." %}
        {% else %}
            # force_g is already relative to the tare, so it is the seat reading as-is
            {% set ns.force = fg|float %}
            {% if ns.force|abs >= min_g %}
                {% set ns.ok = 1 %}
            {% endif %}
        {% endif %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_INDX_HOME_VERIFY VARIABLE=last_ok VALUE={ns.ok}
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_VERIFY VARIABLE=last_force_g VALUE={ns.force}
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_VERIFY VARIABLE=last_err VALUE='"{ns.err}"'

[gcode_macro _INDX_HOME_VERIFY_RAISE]
description: Inner - fail closed if the load cell is missing or uncalibrated
gcode:
    {% set v = printer["gcode_macro _INDX_HOME_VERIFY"] %}
    {% if v.last_err %}
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z_FAIL VARIABLE=msg VALUE='"{v.last_err}"'
        _INDX_HOME_Z_FAIL
    {% endif %}

[gcode_macro _INDX_HOME_Z]
description: Inner - load-cell verify, then keep seated tool or pick T0, then probe Z
variable_z_known: 0
variable_z_faked: 0
gcode:
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z VARIABLE=z_faked VALUE=0
    {% if "xy" not in printer.toolhead.homed_axes %}
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z_FAIL VARIABLE=msg VALUE='"Cannot home Z until X and Y are homed. Run G28, or G28 X Y then G28 Z."'
        _INDX_HOME_Z_FAIL
    {% else %}
        # Remember whether Z was ever homed. Do not pick T0 at a guessed height.
        {% set z_known = 1 if "z" in printer.toolhead.homed_axes else 0 %}
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z VARIABLE=z_known VALUE={z_known}
        # Mark Z homed at the current height so G0 XY is allowed before the probe.
        {% if "z" not in printer.toolhead.homed_axes %}
            SET_KINEMATIC_POSITION SET_HOMED=Z
            SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z VARIABLE=z_faked VALUE=1
        {% endif %}
        _INDX_HOME_VERIFY
        _INDX_HOME_Z_AFTER_SOFT
    {% endif %}

[gcode_macro _INDX_HOME_Z_AFTER_SOFT]
description: Inner - after verify: refuse unknown seat, pick T0 only if the cell is empty
gcode:
    {% set last_ok = printer["gcode_macro _INDX_HOME_VERIFY"].last_ok|int %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    # The seat check is the load cell, not the saved tool number or the latch
    # state, so a refusal has to say what the cell read. Without it an empty
    # head and a mistared cell with a tool bolted in give the same message.
    {% set fg_s = "%.0f"|format(printer["gcode_macro _INDX_HOME_VERIFY"].last_force_g|float) %}
    {% set min_s = "%.0f"|format(printer["gcode_macro TOOL_POSITIONS"].home_min_force_g|default(800.0)|float) %}

    {% set z_known = printer["gcode_macro _INDX_HOME_Z"].z_known|int %}
    # With home_check_seat off, last_ok was written from active_tool rather than
    # from the cell, so the refusals below must not quote a reading nobody took.
    {% set checking = printer["gcode_macro TOOL_POSITIONS"].home_check_seat|default(false) %}

    {% if last_ok == 1 and act < 0 %}
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z_FAIL VARIABLE=msg VALUE='"Cannot home Z: the load cell sees a tool but active_tool is unknown. If you placed it by hand, run MANUAL_TOOL_SEAT TOOL=<n> to lock and claim it. If it came from a dock, CHANGE_TOOL TOOL=<n>. If the head is really empty, MANUAL_TOOLHEAD_RESET. Then G28."'
        _INDX_HOME_Z_FAIL
    {% elif last_ok != 1 and act >= 0 %}
        # The cell says empty, the saved tool says T{act}. One of them is wrong and
        # nothing here can tell which. The old code picked the cell and fetched T0.
        # When the cell is the wrong one, because it was tared with a tool in the
        # head, that drives the loaded tool straight into another dock. Refuse and
        # let a human say which is true, the same way the opposite disagreement
        # above is refused.
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z_FAIL VARIABLE=msg VALUE='"Cannot home Z: load cell reads {fg_s} g (empty, needs {min_s} g) but active_tool says T{act}. These disagree and INDX cannot tell which is right, so it will not move. If T{act} IS in the head the cell is mistared and fetching another tool would crash it into the dock: run CALIBRATE_LOAD_CELL with an empty head. If the head really is empty, run MANUAL_TOOLHEAD_RESET, then G28 Z."'
        _INDX_HOME_Z_FAIL
    {% elif last_ok != 1 %}
        # act < 0: the cell and the saved state agree the head is empty.
        {% if not z_known %}
            {% if checking %}
                SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z_FAIL VARIABLE=msg VALUE='"Cannot home Z: no tool seated. Load cell reads {fg_s} g, needs {min_s} g. If a tool IS seated, the cell is reading low and the tare is the first thing to check: run CALIBRATE_LOAD_CELL with an empty head. Otherwise place a tool on the head by hand, run MANUAL_TOOL_SEAT TOOL=<n>, then G28 Z."'
            {% else %}
                SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z_FAIL VARIABLE=msg VALUE='"Cannot home Z: no tool claimed (active_tool is -1) and Z has never been homed. Z homing probes with the nozzle, so it needs a tool. Place one on the head by hand and run MANUAL_TOOL_SEAT TOOL=<n> to lock and claim it, then G28 Z."'
            {% endif %}
            _INDX_HOME_Z_FAIL
        {% else %}
            # Both sources agree the head is empty, so a pickup cannot collide with
            # a tool already in the gripper. active_tool is already -1, which is what
            # makes CHANGE_TOOL run rather than short-circuit on act != t, and what
            # keeps it from parking and from folding a stale Z offset into
            # global_z_offset.
            SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=1
            CHANGE_TOOL TOOL=0
            SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0
            _INDX_HOME_VERIFY
            _INDX_HOME_Z_AFTER_HARD
        {% endif %}
    {% else %}
        {% set svv = printer.save_variables.variables %}
        {% set tool_x = svv["t" ~ act ~ "_offset_x"]|default(0.0)|float %}
        {% set tool_y = svv["t" ~ act ~ "_offset_y"]|default(0.0)|float %}
        {% set tool_z = svv["t" ~ act ~ "_offset_z"]|default(0.0)|float %}
        {% set global_z = svv.global_z_offset|default(0.0)|float %}
        SET_GCODE_OFFSET X={"%.3f"|format(tool_x)} Y={"%.3f"|format(tool_y)} Z='{"%.3f"|format(tool_z + global_z)}' MOVE=0
        _INDX_HOME_Z_PROBE
    {% endif %}

[gcode_macro _INDX_HOME_Z_AFTER_HARD]
description: Inner - after T0 pickup: abort if the cell still does not see a tool
gcode:
    {% set last_ok = printer["gcode_macro _INDX_HOME_VERIFY"].last_ok|int %}
    {% set fg_s = "%.0f"|format(printer["gcode_macro _INDX_HOME_VERIFY"].last_force_g|float) %}
    {% set min_s = "%.0f"|format(printer["gcode_macro TOOL_POSITIONS"].home_min_force_g|default(800.0)|float) %}
    {% set checking = printer["gcode_macro TOOL_POSITIONS"].home_check_seat|default(false) %}
    {% if last_ok != 1 %}
        {% if checking %}
            SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z_FAIL VARIABLE=msg VALUE='"Cannot home Z: T0 not seated after pickup. Load cell reads {fg_s} g, needs {min_s} g."'
        {% else %}
            SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z_FAIL VARIABLE=msg VALUE='"Cannot home Z: T0 pickup did not complete - active_tool is still -1 afterwards."'
        {% endif %}
        _INDX_HOME_Z_FAIL
    {% else %}
        _INDX_HOME_Z_PROBE
    {% endif %}

[gcode_macro _INDX_HOME_Z_PROBE]
description: Inner - move to probe XY and G28 Z
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set th = printer.toolhead %}
    {% set px = tp.probe_x|float %}
    {% set py = tp.probe_y|float %}
    {% if px < 0 %}
        {% set px = (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
    {% endif %}
    {% if py < 0 %}
        {% set py = (th.axis_minimum.y + th.axis_maximum.y) / 2 %}
    {% endif %}

    G90
    G0 X{"%.3f"|format(px)} Y{"%.3f"|format(py)} F3000
    G28 Z
    # G28 Z leaves the nozzle at the trigger point, a hair off the bed. Lift to
    # the same clearance the hop uses so whatever runs next starts from a known
    # safe height instead of skimming the surface.
    G0 Z{"%.3f"|format(tp.probe_z_clearance|float)} F900
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z VARIABLE=z_faked VALUE=0
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    SAVE_VARIABLE VARIABLE=z_home_tool VALUE={act}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0

[gcode_macro _INDX_HOME_Z_FAIL]
description: Inner - drop the provisional Z home, clear homing_busy, then raise
variable_msg: ""
gcode:
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0
    # _INDX_HOME_Z marks Z homed at the hop height so it can move to the probe
    # XY. That height is a guess. If we never reached the probe, clear it again,
    # otherwise the axis reports homed at a made-up origin and the next G0 Z
    # drives the nozzle into the bed.
    {% if printer["gcode_macro _INDX_HOME_Z"].z_faked|int %}
        SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
        SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z VARIABLE=z_faked VALUE=0
    {% endif %}
    _INDX_HOME_Z_FAIL_RAISE

[gcode_macro _INDX_HOME_Z_FAIL_RAISE]
description: Inner - raise after busy is cleared
gcode:
    {action_raise_error(printer["gcode_macro _INDX_HOME_Z_FAIL"].msg)}
